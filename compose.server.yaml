name: panizstyle

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run ops/create-server-env.sh first}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Run ops/create-server-env.sh first}
      MYSQL_USER: ${MYSQL_USER:?Run ops/create-server-env.sh first}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run ops/create-server-env.sh first}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  migrate:
    profiles: ["setup"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env.server
    depends_on:
      mysql:
        condition: service_healthy
    command: ["npm", "run", "prisma:migrate:deploy"]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.server
    expose:
      - "4000"
    volumes:
      - panizstyle_data:/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 35s

  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Run ops/create-server-env.sh first}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Run ops/create-server-env.sh first}
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      storefront:
        condition: service_healthy

volumes:
  mysql_data:
  panizstyle_data:
  caddy_data:
  caddy_config:
