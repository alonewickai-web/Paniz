<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff9f6">
    <title>اتصال اینترنت در دسترس نیست | پانیذ</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: #fffaf7; color: #29262a; font: 16px/2 sans-serif; text-align: center; }
      main { width: min(100%, 440px); padding: 32px 24px; border: 1px solid #eee7e4; border-radius: 24px; background: white; box-shadow: 0 12px 35px rgba(63, 38, 43, .075); }
      img { width: 104px; height: 104px; border-radius: 24px; object-fit: cover; }
      h1 { margin: 12px 0 4px; font-size: 22px; }
      p { margin: 0; color: #6e6870; }
      button { min-height: 48px; margin-top: 20px; padding: 0 24px; border: 0; border-radius: 14px; background: #c72e52; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="لوگوی پانیذ">
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>برای دیدن محصولات و ادامهٔ خرید، اتصال اینترنتت را بررسی کن و دوباره تلاش کن.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
